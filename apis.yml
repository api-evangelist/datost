name: Datost
description: >-
  Datost Inc. is a New York applied research lab building hardware and intelligent
  systems that operate in your environment without demanding constant attention —
  "computers that come after the screen." Its first public product is ED1TH, a
  25-gram pair of AI augmented-reality smart glasses with a 640x480 green Micro-LED
  in-lens display readable in direct sunlight, hot-swap battery cells, a companion
  steel smart ring for gesture control, and a privacy-first design with zero cameras
  and a single hardware-mutable microphone. ED1TH runs ED1TH-OS and handles email,
  calendar, turn-by-turn navigation, live translation, and meeting transcription in
  the wearer's field of view. Datost is backed by Y Combinator (Spring 2026) and
  OpenAI. As a consumer hardware and applied-research company, Datost does not
  currently publish a public web API, OpenAPI, SDK, or developer portal.
